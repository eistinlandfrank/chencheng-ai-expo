name: Deploy production server

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: chencheng-expo-server-production
  cancel-in-progress: true

jobs:
  notify:
    name: Send verified deployment callback
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request deployment
        env:
          OIDC_AUDIENCE: https://chencheng-expo.pages.dev/webhooks/github/actions
          WEBHOOK_URL: https://chencheng-expo.pages.dev/webhooks/github/actions
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl --silent --show-error --fail --max-time 20 \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          oidc_token="$(node -e \
            'const fs=require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(0,"utf8")).value)' \
            <<<"${token_response}")"
          echo "::add-mask::${oidc_token}"
          payload="$(node -e \
            'process.stdout.write(JSON.stringify({repository:process.env.GITHUB_REPOSITORY,ref:process.env.GITHUB_REF,commit:process.env.GITHUB_SHA}))')"
          delivery="${GITHUB_SHA:0:16}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --silent --show-error --fail-with-body --max-time 20 \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --request POST \
            --header "Authorization: Bearer ${oidc_token}" \
            --header 'Content-Type: application/json' \
            --header "X-GitHub-Delivery: ${delivery}" \
            --data-binary "${payload}" \
            "${WEBHOOK_URL}"
