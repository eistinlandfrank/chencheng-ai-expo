name: Deploy Cloudflare Pages proxy

on:
  push:
    branches: [main]
    paths:
      - deploy/pages-proxy/**
      - .github/workflows/deploy-cloudflare-pages-proxy.yml
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: chencheng-expo-pages-production
  cancel-in-progress: true

env:
  PAGES_PROJECT: chencheng-expo

jobs:
  deploy:
    name: Publish production proxy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create Pages project when absent
        id: setup
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/cloudflare-pages-project.json"
          project_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}"
          status="$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${project_url}")"
          if [[ "${status}" == "404" ]]; then
            status="$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data '{"name":"chencheng-expo","production_branch":"main"}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects")"
          fi
          if [[ "${status}" != "200" ]]; then
            echo "Cloudflare Pages project setup failed with HTTP ${status}."
            exit 1
          fi

      - name: Deploy production proxy
        id: publish
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.127.1'
          command: >-
            pages deploy deploy/pages-proxy
            --project-name=chencheng-expo
            --branch=main
            --commit-hash=${{ github.sha }}
            --commit-dirty=false
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify public entry
        id: verify
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --silent --show-error --fail --max-time 15 \
              --output /dev/null https://chencheng-expo.pages.dev/; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Publish sanitized deployment status
        if: always()
        env:
          DEPLOY_SHA: ${{ github.sha }}
          SETUP_STATUS: ${{ steps.setup.outcome }}
          PUBLISH_STATUS: ${{ steps.publish.outcome }}
          VERIFY_STATUS: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          status_file="${RUNNER_TEMP}/pages-deploy-status.json"
          printf '{"sha":"%s","setup":"%s","publish":"%s","verify":"%s"}\n' \
            "${DEPLOY_SHA}" "${SETUP_STATUS}" "${PUBLISH_STATUS}" "${VERIFY_STATUS}" > "${status_file}"
          blob="$(git hash-object -w "${status_file}")"
          tree="$(printf '100644 blob %s\tstatus.json\n' "${blob}" | git mktree)"
          parent="$(git ls-remote --heads origin refs/heads/automation/pages-deploy-status | awk '{print $1}')"
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="${GIT_AUTHOR_NAME}"
          export GIT_COMMITTER_EMAIL="${GIT_AUTHOR_EMAIL}"
          if [[ -n "${parent}" ]]; then
            commit="$(printf 'Update Pages deployment status\n' | git commit-tree "${tree}" -p "${parent}")"
          else
            commit="$(printf 'Create Pages deployment status\n' | git commit-tree "${tree}")"
          fi
          git push origin "${commit}:refs/heads/automation/pages-deploy-status"

      - name: Fail when deployment did not complete
        if: >-
          always() &&
          (steps.setup.outcome != 'success' ||
          steps.publish.outcome != 'success' ||
          steps.verify.outcome != 'success')
        shell: bash
        run: exit 1
