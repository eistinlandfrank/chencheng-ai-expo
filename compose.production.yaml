name: chencheng-ai-expo-three-portals

services:
  gateway:
    image: chencheng-ai-expo-gateway:${APP_VERSION:?APP_VERSION must be a full Git commit SHA}
    build:
      context: ./deploy/gateway
      dockerfile: Dockerfile
      network: host
      args:
        APP_VERSION: ${APP_VERSION:?APP_VERSION must be a full Git commit SHA}
    container_name: chencheng-gateway
    restart: unless-stopped
    init: true
    environment:
      GATEWAY_HOST_PORT: ${GATEWAY_HOST_PORT:-3100}
      PLATFORM_HOST_PORT: ${PLATFORM_HOST_PORT:-3101}
      VISITOR_HOST_PORT: ${VISITOR_HOST_PORT:-3102}
      WEBHOOK_HOST_PORT: ${WEBHOOK_HOST_PORT:-3103}
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      platform:
        condition: service_healthy
      visitor:
        condition: service_healthy
      webhook:
        condition: service_healthy

  platform:
    image: chencheng-ai-expo-platform:${APP_VERSION:?APP_VERSION must be a full Git commit SHA}
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        APP_VERSION: ${APP_VERSION:?APP_VERSION must be a full Git commit SHA}
    container_name: chencheng-platform
    restart: unless-stopped
    init: true
    env_file:
      - ${SECRETS_DIR:?SECRETS_DIR is required}/platform.env
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      HOSTNAME: 127.0.0.1
      PORT: ${PLATFORM_HOST_PORT:-3101}
      DATA_DIR: /data
      DATABASE_PATH: /data/expo-service.sqlite
    network_mode: host
    volumes:
      - type: bind
        source: ${PLATFORM_DATA_DIR:?PLATFORM_DATA_DIR is required}
        target: /data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  visitor:
    image: chencheng-ai-expo-visitor:${APP_VERSION:?APP_VERSION must be a full Git commit SHA}
    build:
      context: ./visitor-app
      dockerfile: Dockerfile
      network: host
      args:
        APP_VERSION: ${APP_VERSION:?APP_VERSION must be a full Git commit SHA}
    container_name: chencheng-visitor
    restart: unless-stopped
    init: true
    env_file:
      - ${SECRETS_DIR:?SECRETS_DIR is required}/visitor.env
    environment:
      NODE_ENV: production
      HOSTNAME: 127.0.0.1
      PORT: ${VISITOR_HOST_PORT:-3102}
      NEXT_TELEMETRY_DISABLED: 1
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  webhook:
    image: chencheng-ai-expo-webhook:${APP_VERSION:?APP_VERSION must be a full Git commit SHA}
    build:
      context: ./deploy/webhook
      dockerfile: Dockerfile
      network: host
      args:
        APP_VERSION: ${APP_VERSION:?APP_VERSION must be a full Git commit SHA}
    container_name: chencheng-deploy-webhook
    restart: unless-stopped
    init: true
    env_file:
      - ${SECRETS_DIR:?SECRETS_DIR is required}/webhook.env
    environment:
      NODE_ENV: production
      LISTEN_HOST: 127.0.0.1
      PORT: ${WEBHOOK_HOST_PORT:-3103}
      QUEUE_DIR: /queue
    network_mode: host
    volumes:
      - type: bind
        source: ${DEPLOY_QUEUE_DIR:?DEPLOY_QUEUE_DIR is required}
        target: /queue
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
