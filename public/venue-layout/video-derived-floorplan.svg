<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">五段视频推断的场馆二维平面图</title>
  <desc id="desc">狭长矩形大厅，中央为参赛团队工作席，北侧为赞助与信息展示带，东侧玻璃墙边布置3D打印机、人形机器人、后勤区和应急出口。</desc>
  <defs>
    <pattern id="table-grid" width="96" height="72" patternUnits="userSpaceOnUse">
      <rect x="10" y="12" width="70" height="42" rx="5" fill="#e8ede2" stroke="#96a28d" stroke-width="1.5"/>
      <rect x="3" y="23" width="8" height="18" rx="3" fill="#b8c2b0"/>
      <rect x="79" y="23" width="8" height="18" rx="3" fill="#b8c2b0"/>
      <circle cx="33" cy="61" r="4" fill="#b8c2b0"/>
      <circle cx="58" cy="61" r="4" fill="#b8c2b0"/>
    </pattern>
    <style>
      text { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill:#1f2924; }
      .zone { stroke:#26312c; stroke-width:2; }
      .zone-label { font-size:18px; font-weight:700; text-anchor:middle; }
      .zone-id { font-size:12px; font-weight:700; text-anchor:middle; letter-spacing:.08em; }
      .minor { font-size:13px; fill:#657069; }
      .tiny { font-size:11px; fill:#6d7771; }
      .route { fill:none; stroke:#4f8f68; stroke-width:4; stroke-dasharray:10 8; stroke-linecap:round; stroke-linejoin:round; }
      .route-node { fill:#fff; stroke:#4f8f68; stroke-width:4; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f3f5f0"/>
  <text x="80" y="62" font-size="28" font-weight="700">视频推断场馆平面图</text>
  <text x="80" y="91" class="minor">依据5段、约160秒步行视频拼接 · 相对比例 · 非施工测绘</text>

  <g aria-label="相对北向">
    <path d="M1480 82V36M1480 36l-10 17M1480 36l10 17" fill="none" stroke="#1f2924" stroke-width="3" stroke-linecap="round"/>
    <text x="1480" y="25" text-anchor="middle" font-size="15" font-weight="700">北（推测）</text>
  </g>

  <rect x="100" y="140" width="1400" height="700" rx="4" fill="#fff" stroke="#1f2924" stroke-width="5"/>
  <text x="112" y="130" class="minor">西侧实体墙</text>
  <line x1="1490" y1="150" x2="1490" y2="830" stroke="#5e91a8" stroke-width="7" stroke-dasharray="20 10"/>

  <g aria-label="北侧赞助与信息展示带">
    <rect class="zone" x="150" y="170" width="245" height="88" rx="8" fill="#f5d982"/>
    <text class="zone-id" x="272" y="195">B1</text>
    <text class="zone-label" x="272" y="225">赞助商背景墙</text>
    <text class="tiny" x="272" y="246" text-anchor="middle">SPONSOR</text>

    <rect class="zone" x="415" y="170" width="235" height="88" rx="8" fill="#f5d982"/>
    <text class="zone-id" x="532" y="195">B2</text>
    <text class="zone-label" x="532" y="225">LiberNovo 清闲</text>
    <text class="tiny" x="532" y="246" text-anchor="middle">人体工学座椅展示</text>

    <rect class="zone" x="670" y="170" width="205" height="88" rx="8" fill="#f5d982"/>
    <text class="zone-id" x="772" y="195">B3</text>
    <text class="zone-label" x="772" y="225">SHENICEST</text>
    <text class="tiny" x="772" y="246" text-anchor="middle">CODING 创意展示</text>

    <rect class="zone" x="895" y="170" width="205" height="88" rx="8" fill="#f5d982"/>
    <text class="zone-id" x="997" y="195">B4</text>
    <text class="zone-label" x="997" y="225">HOTO</text>
    <text class="tiny" x="997" y="246" text-anchor="middle">互动 / 短暂停留</text>

    <rect class="zone" x="1120" y="170" width="165" height="88" rx="8" fill="#d8c8eb"/>
    <text class="zone-id" x="1202" y="195">D1</text>
    <text class="zone-label" x="1202" y="219">知乎 AI Builder</text>
    <text class="tiny" x="1202" y="243" text-anchor="middle">创作活动宣传</text>

    <rect class="zone" x="1305" y="170" width="155" height="88" rx="8" fill="#d8c8eb"/>
    <text class="zone-id" x="1382" y="195">D2</text>
    <text class="zone-label" x="1382" y="219">招聘 / 能力接入</text>
    <text class="tiny" x="1382" y="243" text-anchor="middle">宣传板组</text>
  </g>

  <rect x="150" y="295" width="1020" height="505" rx="5" fill="url(#table-grid)" stroke="#7f8e81" stroke-width="2"/>
  <rect x="650" y="280" width="105" height="540" fill="#fff" stroke="#c3ccc3" stroke-width="2"/>
  <text x="702" y="552" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(-90 702 552)">A2 中央纵向主通道</text>

  <g aria-label="横向联络通道">
    <rect x="150" y="410" width="1040" height="34" fill="#fff" stroke="#d7ddd7"/>
    <rect x="150" y="562" width="1040" height="36" fill="#fff" stroke="#d7ddd7"/>
    <rect x="150" y="704" width="1040" height="34" fill="#fff" stroke="#d7ddd7"/>
    <text x="182" y="433" class="tiny">A3 横向联络通道</text>
  </g>

  <g aria-label="工作席分区标签">
    <rect x="180" y="315" width="160" height="34" rx="17" fill="#fff" stroke="#7f8e81"/>
    <text x="260" y="338" font-size="14" font-weight="700" text-anchor="middle">A1 工作席主区</text>
    <text x="410" y="535" class="minor" text-anchor="middle">密集白色长桌矩阵</text>
    <text x="930" y="535" class="minor" text-anchor="middle">桌位未见统一编号</text>
  </g>

  <rect class="zone" x="1030" y="274" width="130" height="62" rx="7" fill="#d8c8eb" stroke-dasharray="8 5"/>
  <text class="zone-id" x="1095" y="295">D3</text>
  <text x="1095" y="319" font-size="14" text-anchor="middle">服务 / 志愿者?</text>

  <rect x="1185" y="275" width="95" height="545" fill="#eef7f5" stroke="#66a69e" stroke-width="2"/>
  <text x="1233" y="552" font-size="14" font-weight="700" fill="#3d766f" text-anchor="middle" transform="rotate(-90 1233 552)">A4 玻璃幕墙侧边通道</text>

  <g aria-label="东侧设备及后勤展示带">
    <rect class="zone" x="1300" y="300" width="160" height="225" rx="8" fill="#a8d8d1"/>
    <text class="zone-id" x="1380" y="326">C1</text>
    <text class="zone-label" x="1380" y="362">Snapmaker</text>
    <text class="zone-label" x="1380" y="389">3D打印设备</text>
    <g fill="#fff" stroke="#4a8e86" stroke-width="2">
      <rect x="1322" y="413" width="50" height="45" rx="4"/>
      <rect x="1388" y="413" width="50" height="45" rx="4"/>
      <rect x="1322" y="469" width="50" height="35" rx="4"/>
      <rect x="1388" y="469" width="50" height="35" rx="4"/>
    </g>

    <rect class="zone" x="1300" y="545" width="160" height="100" rx="8" fill="#a8d8d1"/>
    <text class="zone-id" x="1380" y="568">C2</text>
    <circle cx="1380" cy="588" r="11" fill="#fff" stroke="#4a8e86" stroke-width="2"/>
    <path d="M1380 599v22M1365 607h30M1371 637l9-16 9 16" fill="none" stroke="#4a8e86" stroke-width="4" stroke-linecap="round"/>
    <text x="1330" y="630" font-size="13">人形机器人</text>

    <rect class="zone" x="1300" y="665" width="160" height="135" rx="8" fill="#d8c8eb"/>
    <text class="zone-id" x="1380" y="692">D4</text>
    <text class="zone-label" x="1380" y="725">后勤 / 设备暂存</text>
    <rect x="1330" y="746" width="42" height="28" fill="#fff" stroke="#735f8c"/>
    <rect x="1380" y="753" width="48" height="21" fill="#fff" stroke="#735f8c"/>
  </g>

  <g aria-label="应急出口组">
    <rect x="1480" y="320" width="20" height="55" fill="#ee8d7f"/>
    <rect x="1480" y="445" width="20" height="55" fill="#ee8d7f"/>
    <rect x="1480" y="580" width="20" height="55" fill="#ee8d7f"/>
    <rect x="1480" y="715" width="20" height="55" fill="#ee8d7f"/>
    <text x="1542" y="548" font-size="13" fill="#4c6f7f" text-anchor="middle" transform="rotate(-90 1542 548)">东侧玻璃幕墙 · E1 应急出口组</text>
  </g>

  <g aria-label="回收点">
    <rect x="112" y="700" width="18" height="58" rx="3" fill="#5e91a8"/>
    <rect x="132" y="700" width="18" height="58" rx="3" fill="#48524d"/>
    <text x="131" y="781" font-size="12" text-anchor="middle">E2 回收点</text>
  </g>

  <g aria-label="结构柱" fill="#fff" stroke="#8a938d" stroke-width="3">
    <rect x="1138" y="350" width="34" height="65"/>
    <rect x="1138" y="515" width="34" height="65"/>
    <rect x="1138" y="680" width="34" height="65"/>
  </g>
  <text x="1155" y="780" class="tiny" text-anchor="middle">柱网</text>

  <g aria-label="可通行路线骨架">
    <path class="route" d="M703 815V275H1230V815M703 430H1230M703 580H1230M703 720H1230"/>
    <circle class="route-node" cx="703" cy="815" r="8"/>
    <circle class="route-node" cx="703" cy="720" r="8"/>
    <circle class="route-node" cx="703" cy="580" r="8"/>
    <circle class="route-node" cx="703" cy="430" r="8"/>
    <circle class="route-node" cx="703" cy="275" r="8"/>
    <circle class="route-node" cx="1230" cy="275" r="8"/>
    <circle class="route-node" cx="1230" cy="430" r="8"/>
    <circle class="route-node" cx="1230" cy="580" r="8"/>
    <circle class="route-node" cx="1230" cy="720" r="8"/>
    <circle class="route-node" cx="1230" cy="815" r="8"/>
  </g>

  <text x="703" y="872" font-size="15" font-weight="700" text-anchor="middle">视频起始侧 / 主入口未确认</text>
  <path d="M703 848v-26M703 822l-8 12M703 822l8 12" fill="none" stroke="#1f2924" stroke-width="2.5" stroke-linecap="round"/>

  <g aria-label="图例" transform="translate(100 912)">
    <text x="0" y="0" font-size="15" font-weight="700">图例</text>
    <rect x="58" y="-15" width="24" height="16" fill="#f5d982" stroke="#26312c"/><text x="91" y="0" class="minor">赞助展示</text>
    <rect x="197" y="-15" width="24" height="16" fill="#a8d8d1" stroke="#26312c"/><text x="230" y="0" class="minor">设备展示</text>
    <rect x="335" y="-15" width="24" height="16" fill="#d8c8eb" stroke="#26312c"/><text x="368" y="0" class="minor">服务/信息</text>
    <rect x="486" y="-15" width="24" height="16" fill="url(#table-grid)" stroke="#7f8e81"/><text x="519" y="0" class="minor">工作席</text>
    <line x1="620" y1="-7" x2="666" y2="-7" class="route"/><text x="678" y="0" class="minor">导航骨架（推测）</text>
    <rect x="866" y="-15" width="14" height="20" fill="#ee8d7f"/><text x="890" y="0" class="minor">应急出口</text>
  </g>

  <rect x="100" y="944" width="1400" height="35" rx="6" fill="#fff1cf" stroke="#d4a640"/>
  <text x="800" y="967" font-size="13" text-anchor="middle">重要：本图只表达视频可见区域的相对关系；没有公制比例，不能用于施工、消防审批或精确室内定位。</text>
</svg>
